# Ogni giorno: scarica i dati ufficiali, aggiorna /data, salva le modifiche nel repository
# (la cronologia git diventa il registro pubblico di ogni variazione) e ripubblica il sito.
name: Aggiornamento quotidiano

on:
  # GitHub avvia le esecuzioni programmate anche con ore di ritardo: due orari di partenza,
  # il primo che arriva aggiorna, il secondo vede che i dati di oggi ci sono già e si ferma.
  schedule:
    - cron: "7 0 * * *"    # 01:07 ora italiana (inverno), 02:07 (estate)
    - cron: "37 2 * * *"   # riserva: 03:37 ora italiana (inverno), 04:37 (estate)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiornamento
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    outputs:
      fatto: ${{ steps.oggi.outputs.fatto }}
    steps:
      - uses: actions/checkout@v5
      - id: oggi
        name: Dati di oggi già salvati?
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git log -1 --format=%s | grep -qx "dati: aggiornamento del $(date -u +%F)"; then
            echo "Aggiornamento di oggi già fatto: mi fermo."
            echo "fatto=true" >> "$GITHUB_OUTPUT"
          fi

  dati:
    needs: controllo
    if: needs.controllo.outputs.fatto != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Cache delle query (i periodi chiusi non cambiano)
        uses: actions/cache@v5
        with:
          path: .cache
          key: sparql-${{ github.run_id }}
          restore-keys: sparql-
      - run: pip install -r pipeline/requirements.txt
      - name: Test
        run: cd pipeline && python -m pytest -q
      - name: Aggiorna dati
        run: cd pipeline && python -m memoria.build
      - name: Proponi dichiarazioni da verificare (opzionale)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd pipeline && python -m memoria.revisione.estrai --max 20
      - name: Salva i dati aggiornati
        run: |
          git config user.name "memoria-bot"
          git config user.email "memoria-bot@users.noreply.github.com"
          git add data contenuti/coda_revisione || true
          if git diff --cached --quiet; then echo "Nessuna variazione"; else
            git commit -m "dati: aggiornamento del $(date -u +%F)"
            git push
          fi

  sito:
    needs: dati
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - run: git pull --ff-only
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v5
