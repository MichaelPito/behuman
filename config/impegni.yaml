- id: crescita
  nome: Crescita dell'economia (PIL)
  # il PIL come misura di altro («2% del PIL», «in rapporto al PIL») non è il tema
  parole: '(?<!del )(?<!sul )(?<!al )(?<!di )(?<!nel )(?<!% )\b(pil|prodotto interno lordo)\b|\bcrescita economica\b'
  direzioni:
    aumento: '\b(rilanciar\w*|aumentar\w*|far crescere|sostener\w*|spinger\w*|incrementar\w*|raddoppiar\w*)'
  rigore: alto
  indicatori: [pil]
  leggi: ''

