  direzioni:
    abolizione: '\b(abol\w*|cancell\w*|elimin\w*|togli\w*|superar\w*)'
    aumento: '\b(difend\w*|rafforz\w*|estender\w*|potenzi\w*)'
  indicatori: []
  leggi: '\b(reddito di cittadinanza|inclusione)\b'

- id: disoccupazione
  nome: Disoccupazione
  parole: '\bdisoccupa\w*'
  direzioni:
    riduzione: '\b(ridu\w*|ridurr\w*|abbatt\w*|combatt\w*|contrast\w*|tagli\w*|dimezz\w*|azzer\w*|sconfigg\w*|diminu\w*)'
  rigore: alto
  indicatori: [disoccupazione, disoccupazione-giovanile]
  leggi: '\b(lavor\w*|occupa\w*)'

- id: occupazione
  nome: Occupazione
  parole: '\b(occupati|occupazione(?! abusiv)(?! dell[ae] cas)(?! di (case|immobili|edifici|scuole)))\b|\bposti di lavoro\b'
  direzioni:
    aumento: '\b(aumentar\w*|crear\w*|creiamo|creeremo|rilanciar\w*|incrementar\w*|favorir\w*|sostener\w*|far crescere|raddoppiar\w*)'
  rigore: alto
