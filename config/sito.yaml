# Impostazioni generali del progetto.
nome: Memoria Politica          # nome di lavoro, sostituibile (vedi docs/06-piano-comunicazione.md)
finestra_anni: 5                # quanto indietro si guarda (rolling, calcolato ogni giorno)

# Elenco mostrato nella pagina /fonti. Ogni dato pubblicato deve venire da qui.
fonti:
  - nome: Camera dei Deputati – dati.camera.it
    url: https://dati.camera.it/
    uso: Votazioni nominali, presenze, gruppi parlamentari, atti, incarichi di governo (SPARQL)
    licenza: CC BY-SA 4.0 (per questo i dati derivati del sito sono rilasciati CC BY-SA 4.0)
  - nome: Senato della Repubblica – dati.senato.it
    url: https://dati.senato.it/
    uso: Votazioni nominali, presenze, gruppi parlamentari, disegni di legge (SPARQL)
    licenza: CC BY 3.0 IT
  - nome: Governo italiano – governo.it
    url: https://www.governo.it/
    uso: Comunicati e atti del Consiglio dei ministri (RSS e archivio), interventi della Presidente del Consiglio
    licenza: CC BY 3.0 IT (salvo diversa indicazione)
  - nome: Camera dei Deputati – resoconti stenografici dell'Assemblea
    url: https://www.camera.it/
    uso: Testo degli interventi in Aula (estratto con link al punto esatto del resoconto)
    licenza: CC BY-SA 4.0
  - nome: Corte costituzionale – open data
    url: https://dati.cortecostituzionale.it/
    uso: Sentenze e ordinanze che citano le leggi della legislatura
    licenza: CC BY-SA 3.0
  - nome: Ministero della Giustizia – piattaforma per la raccolta delle firme
    url: https://firmereferendum.giustizia.it/
    uso: Firme online raccolte per referendum e leggi di iniziativa popolare
    licenza: Dati pubblici
  - nome: Ministero dell'Interno – Eligendo
    url: https://elezioni.interno.gov.it/
    uso: Risultati ufficiali dei referendum
    licenza: Dati pubblici
  - nome: Ministero dell'Ambiente e della Sicurezza Energetica – prezzi dei carburanti
    url: https://sisen.mase.gov.it/dgsaie/prezzi-settimanali-carburanti
    uso: Accise su benzina e gasolio, per misurare le promesse sulle accise
    licenza: Dati pubblici
  - nome: Eurostat
    url: https://ec.europa.eu/eurostat/databrowser/view/gov_10a_taxag/default/table
    uso: Pressione fiscale (entrate fiscali e contributive in % del PIL)
    licenza: CC BY 4.0
  - nome: UNHCR – arrivi via mare in Italia
    url: https://data.unhcr.org/en/situations/mediterranean/location/5205
    uso: Persone sbarcate (dati del Ministero dell'Interno), somma degli ultimi 12 mesi
    licenza: Riuso con citazione della fonte (termini d'uso UNHCR)
  - nome: Programmi elettorali 2022
    url: https://dait.interno.gov.it/elezioni/trasparenza/elezioni-politiche-2022
    uso: Impegni presi prima delle elezioni (PDF depositati, programmi completi pubblicati dai partiti)
    licenza: Documenti pubblici; si linka l'originale
  - nome: Google News
    url: https://news.google.com/
    uso: Titoli delle notizie sui politici monitorati, per l'osservatorio quotidiano (solo titolo, testata, data e link)
    licenza: Si linka l'articolo originale
  - nome: Facta e Open Fact-checking
    url: https://www.facta.news/
    uso: Verifiche di contenuti virali sui social che riguardano i politici monitorati (giudizio attribuito a loro)
    licenza: Si linka la verifica originale
  - nome: Pagella Politica
    url: https://pagellapolitica.it/
    uso: Quali dichiarazioni sono state scelte per una verifica («le più discusse»); frase, data, link e loro giudizio, attribuito a loro
    licenza: "Contenuti © Pagella Politica, non ne riproduciamo i testi"
  - nome: Wikidata
    url: https://www.wikidata.org/
    uso: Anagrafica, cariche, appartenenza ai partiti, foto (da Wikimedia Commons)
    licenza: CC0 (dati) · licenze varie per le foto, indicate su Commons
  - nome: Ministero dell'Interno – Elezioni trasparenti (DAIT)
    url: https://dait.interno.gov.it/elezioni/trasparenza/elezioni-politiche-2022
    uso: Programmi elettorali 2022 depositati dalle liste (legge 165/2017)
    licenza: Documenti pubblici per legge; si linka il documento originale
  - nome: Chapel Hill Expert Survey (CHES)
    url: https://www.chesdata.eu/
    uso: Posizionamento destra/sinistra e su UE dei partiti (misura accademica indipendente)
    licenza: Uso con citazione degli autori
